version: '3.8'

services:
  backend:
    build: .
    container_name: flash-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_CACHE_ENABLED=true
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: flash-ai-redis
    ports:
      - "6379:6379"
    restart: always

networks:
  default:
    name: flash-ai-network
